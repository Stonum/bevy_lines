html {

body {

.game-container {
   width: 100vw;
   height: 100vh;
   display: flex;
   justify-content: center;

}

.lds-dual-ring {
   display: inline-block;
   position: absolute;
   left: 0;
   right: 0;
   margin: auto;
   width: 80px;
   height: 80px;
}

.lds-dual-ring:after {
   content: " ";
   display: block;
   width: 64px;
   height: 64px;
   border-radius: 50%;
   border: 6px solid #fff;
   border-color: #fff transparent #fff transparent;
   animation: lds-dual-ring 1.2s linear infinite;
}

@keyframes lds-dual-ring {
   0% {
      transform: rotate(0deg);
   }

   100% {
      transform: rotate(360deg);
   }
}

#bevy {
   /* Fixed 3:2 internal resolution (900x600), scaled to fit the viewport

      pixel buffer stays exactly 900x600 (see WindowResolution in main.rs),

   height: min(100vh, 66.6667vw) !important;
